{% include base_path %}

<article class="publication-item" itemscope itemtype="https://schema.org/ScholarlyArticle">
  {% if post.thumbnail %}
    <a class="publication-item__thumbnail" href="{{ base_path }}{{ post.url }}" aria-label="Read {{ post.title }}">
      <img src="{{ post.thumbnail | prepend: '/images/' | prepend: base_path }}" alt="" loading="lazy">
    </a>
  {% endif %}

  <div class="publication-item__content">
    <h3 class="publication-item__title" itemprop="headline">
      <a href="{{ base_path }}{{ post.url }}">{{ post.title }}</a>
    </h3>
    <p class="publication-item__meta">
      <span>{{ post.venue_short | default: post.venue }}</span>
      <span aria-hidden="true"> · </span>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y" }}</time>
    </p>
  </div>
</article>
